name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created != 'true' && steps.release.outputs.prs_created == 'true'
        with:
          fetch-depth: 0

      - name: Auto-merge Valheim rebuild releases
        if: steps.release.outputs.release_created != 'true' && steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: bash scripts/automerge-valheim-release.sh

      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: actions/setup-dotnet@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          dotnet-version: 8.0.x

      - id: buildid
        if: steps.release.outputs.release_created == 'true'
        run: |
          id="$(curl -fsSL https://api.steamcmd.net/v1/info/896660 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["data"]["896660"]["depots"]["branches"]["public"]["buildid"])')"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          path: .refs
          key: refs-${{ steps.buildid.outputs.id }}-${{ hashFiles('deps/bepinex-pack.version') }}

      - name: Package
        if: steps.release.outputs.release_created == 'true'
        run: make package

      - uses: softprops/action-gh-release@v2
        if: steps.release.outputs.release_created == 'true'
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            dist/EvuMinimap-*.zip
            src/EvuMinimap/bin/Release/EvuMinimap.dll
            src/EvuMinimap/bin/Release/EvuMinimap.Core.dll
          fail_on_unmatched_files: true

      - name: Publish to Thunderstore
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run thunderstore.yml --repo "${{ github.repository }}" --ref main -f "tag=${TAG}"
